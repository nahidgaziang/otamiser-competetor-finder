[project]
name = "compare-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.6.0",
    "beautifulsoup4>=4.13.0",
    "crawl4ai>=0.9.5",
    "ddgs>=9.16.1",
    "exa-py>=2.28.0",
    "httpx>=0.28.1",
    "nh3>=0.3.7",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "sqlalchemy>=2.1.8",
    "tavily-python>=0.8.5",
    "tenacity>=9.2.1",
    "tldextract>=5.4.0",
    "trafilatura>=2.3.1",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
xfail_strict = true
markers = [
    "db: needs the PostgreSQL test database (migrated, roles bootstrapped)",
    "defect: documents a confirmed defect from the 2026-11-07 code review; expected to fail until fixed",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"migrations/env.py" = ["E402", "SIM103"]  # sys.path setup must precede imports
# Baseline of findings in existing code at the 2026-11-07 review (see reports/code-review.md).
# Remove each entry when the file is fixed; new code is held to the full rule set.
"src/compare_pipeline/webflow.py" = ["S101"]  # BUG-W4: safety checks must not use assert
"src/compare_pipeline/discovery/discovery.py" = ["UP015", "SIM102"]
"src/compare_pipeline/http/safe_fetch.py" = ["SIM103"]
"src/compare_pipeline/knowledge.py" = ["UP015"]
"src/compare_pipeline/llm.py" = ["UP015"]
"src/compare_pipeline/research.py" = ["SIM110"]
"src/compare_pipeline/validation.py" = ["UP015"]
"tests/test_dedupe_v1.py" = ["UP015"]

[tool.coverage.run]
source = ["compare_pipeline"]
branch = true

[tool.ty.environment]
extra-paths = ["tests"]
