# Local checks before each commit: `pip install pre-commit` (or `uvx pre-commit`), then `pre-commit install`.
# CI runs the same tools, so skipping these locally only delays the failure.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        files: ^pipeline/
      - id: ruff-format
        files: ^pipeline/
